name: Partial legacy dependency smoke

on:
  push:
    branches: [master, codex/python-security-20261024]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'
      - name: Install public CPU wheels for the partial smoke environment
        run: |
          python -m pip install --only-binary=:all: torch==2.0.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --only-binary=:all: -r requirements-smoke.txt
      - name: Test native pitch, tensor pipeline, XML parsing and local Git
        run: python -m unittest -v tests.test_native_smoke
